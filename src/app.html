<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />

		<!--
			Fredoka for headings, Nunito for body -- the ui-ux-pro-max "Playful
			Creative" pairing (see design-system/grade-one/MASTER.md). display=swap so
			text renders in the system font at once on slow mobile data.
		-->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap"
		/>

		<meta name="theme-color" content="#f8f9fc" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0a0b10" media="(prefers-color-scheme: dark)" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
